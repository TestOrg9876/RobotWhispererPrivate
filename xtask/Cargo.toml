[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# For `cargo xtask load-bridge`, the synthetic Foxglove/rosbridge server the
# throughput benchmark runs against. A Python generator would be the
# bottleneck: 1080p60 uncompressed is 373 MB/s per stream.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"

[dev-dependencies]
# The bench payloads are checked against the app's own decoders, so a wrong
# encoding fails in seconds here instead of showing up as an empty pane in a
# fifteen-minute benchmark run.
rw-schema-foxglove = { path = "../crates/rw-schema-foxglove" }
rw-codec-cdr = { path = "../crates/rw-codec-cdr" }
rw-codec-rosmsg = { path = "../crates/rw-codec-rosmsg" }
rw-canonical = { path = "../crates/rw-canonical" }
rw-wire = { path = "../crates/rw-wire" }
