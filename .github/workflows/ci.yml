name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
                                  libxcb1-dev libx11-dev libssl-dev
      # rust-toolchain.toml pins the stable channel used for every native build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gpui_web depends on zed's wasm_thread fork, which needs
      # feature(stdarch_wasm_atomic_wait) — nightly only. See rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Release, and through xtask, so CI builds exactly what the screenshot
      # harness serves — including the wasm-bindgen version check.
      # The CLI and the crate must be the same version — the bindgen format is
      # unstable — so the version comes from the lockfile rather than a literal
      # that would drift the next time dependencies move.
      - run: cargo install wasm-bindgen-cli --locked
             --version "$(cargo run -q -p xtask -- wasm-bindgen-version)"
      - run: cargo run -p xtask -- web
