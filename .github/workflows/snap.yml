name: Snap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: build
        uses: snapcore/action-build@v1

      - uses: actions/upload-artifact@v4
        with:
          name: robot-whisperer-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
