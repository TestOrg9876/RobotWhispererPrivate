[workspace]
members = [
    "crates/rw-canonical",
    "crates/rw-codec-cdr",
    "crates/rw-codec-json",
    "crates/rw-codec-rosmsg",
    "crates/rw-core",
    "crates/rw-pipeline",
    "crates/rw-render",
    "crates/rw-schema-foxglove",
    "crates/rw-schema-ros1",
    "crates/rw-schema-ros2",
    "crates/rw-session",
    "crates/rw-transport",
    "crates/rw-transport-dummy",
    "crates/rw-transport-foxglove-ws",
    "crates/rw-transport-rosbridge",
    "crates/rw-validation",
    "crates/rw-wire",
    "crates/rw-ws",
    "crates/rw-ui",
    "crates/rw-desktop",
    "crates/rw-web",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# --- GPUI ---------------------------------------------------------------------
# The zed dependencies are deliberately NOT pinned with `rev`. gpui-component
# declares them unpinned, and a git source with an explicit rev is a *different*
# source to one without, so pinning here puts two copies of `gpui` in the graph
# and every shared type stops matching ("expected `Entity<..>`, found a
# different `Entity<..>`"). Reproducibility comes from the committed Cargo.lock;
# `cargo update` is the deliberate way to move.
#
# gpui reaches std::hint::cold_path(), stable only from Rust 1.96, hence the
# 1.97.1 pin in rust-toolchain.toml. The `profiler` feature is deliberately not
# enabled: it adds further unstable calls.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_web = { git = "https://github.com/zed-industries/zed" }
gpui-component = { version = "0.5.2", git = "https://github.com/longbridge/gpui-component", rev = "7acfc184382d30864a688fdaa6c9ff719efc53ae" }

# No default features: `sqlite` is one, and the storage backend belongs to
# whichever shell is being built — `rw-desktop` takes SQLite, `rw-web` takes
# IndexedDB. Inheriting the default put libsqlite3-sys in the wasm graph.
rw-core = { path = "crates/rw-core", default-features = false }
rw-canonical = { path = "crates/rw-canonical" }
rw-pipeline = { path = "crates/rw-pipeline" }
rw-render = { path = "crates/rw-render" }
rw-transport = { path = "crates/rw-transport" }
rw-ui = { path = "crates/rw-ui" }

anyhow = "1"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

# The zed and gpui-component graph is enormous, and full debug info for it costs
# tens of gigabytes of `target/` for something nobody steps through. Our own
# crates keep line tables, which is what backtraces actually need.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"
