[package]
name = "rw-ui"
version = "0.1.0"
edition = "2024"
description = "The Robot Whisperer GPUI application"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "wasmbind",
] }
image-crate = { package = "image", version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
gpui.workspace = true
gpui-component.workspace = true

rw-core.workspace = true
rw-canonical.workspace = true
rw-pipeline.workspace = true
rw-assets.workspace = true
rw-record.workspace = true
rw-render.workspace = true
rw-tf.workspace = true
rw-transport.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `include-exclude` is what makes the `#[include]` attribute compile. The
# native build happened to get it through feature unification with another
# crate in the graph; the wasm build, where that crate is absent, did not.
# `include-exclude` makes the `#[include]` attribute compile — the native build
# happened to get it through feature unification with another crate in the graph,
# and the wasm build, where that crate is absent, did not. `debug-embed` makes
# debug builds embed rather than read from the developer's disk, which is the
# only behaviour that works on wasm at all.
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# GPUI's own timer stamps every timer with `Instant::now`, so waiting has to go
# through the browser instead. See `tick.rs`.
gloo-timers = { version = "0.3", features = ["futures"] }
# Not used here — declared to turn on a feature that gpui-component's dependency
# on it leaves off. `instant` falls back to `std::time::Instant` unless
# `wasm-bindgen` is enabled, and on wasm32-unknown-unknown that panics with
# "time not implemented on this platform". It sits under gpui-component's undo
# manager and scrollbars, so without this the browser build dies the moment a
# text field's value is set from code.
instant = { version = "0.1", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }
tokio = { workspace = true, features = ["sync", "macros"] }

[dev-dependencies]
pollster = "0.4"
