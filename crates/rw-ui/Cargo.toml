[package]
name = "rw-ui"
version = "0.1.0"
edition = "2024"
description = "The Robot Whisperer GPUI application"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "wasmbind",
] }
image-crate = { package = "image", version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
gpui.workspace = true
gpui-component.workspace = true

rw-core.workspace = true
rw-canonical.workspace = true
rw-pipeline.workspace = true
rw-transport.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `include-exclude` is what makes the `#[include]` attribute compile. The
# native build happened to get it through feature unification with another
# crate in the graph; the wasm build, where that crate is absent, did not.
# `include-exclude` makes the `#[include]` attribute compile — the native build
# happened to get it through feature unification with another crate in the graph,
# and the wasm build, where that crate is absent, did not. `debug-embed` makes
# debug builds embed rather than read from the developer's disk, which is the
# only behaviour that works on wasm at all.
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
tokio = { workspace = true, features = ["sync", "macros"] }
